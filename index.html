<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프레스티크 오사카 출장 세무 방어 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        /* Mobile-first adjustments */
        body {
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight */
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-24">

    <header class="bg-gray-950 text-white px-4 py-5 shadow-lg sticky top-0 z-50">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-tight">PRESTIQUE Auditor v1.2</h1>
                <p class="text-xs text-gray-400 mt-0.5">오사카 출장 실시간 세무 방어 시스템</p>
            </div>
            <span class="bg-emerald-500 text-white text-xs px-2 py-1 rounded-full font-medium animate-pulse">LIVE</span>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4 space-y-6">

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">오늘 현재까지 누적 지출(예상)</p>
                <p class="text-3xl font-extrabold text-amber-500 mt-1" id="totalJPY">0 <span class="text-xl font-normal text-gray-900">￥</span></p>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500 font-medium uppercase tracking-wider">적재된 증빙</p>
                <p class="text-3xl font-extrabold text-gray-950 mt-1" id="recordCount">0 <span class="text-xl font-normal text-gray-900">건</span></p>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h2 class="text-lg font-semibold text-gray-950 flex items-center gap-2 mb-5 border-b border-gray-100 pb-3">
                <span class="text-emerald-500 text-xl">📝</span> 신규 증빙 및 업무 적재
            </h2>

            <form id="auditForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">업무 카테고리 (필수)</label>
                    <div class="grid grid-cols-2 gap-2" id="categoryContainer">
                        <button type="button" data-value="돈키호테 VMD" class="cate-btn border border-gray-200 rounded-xl py-3 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all text-left flex items-center justify-between">
                            <span>🛒 돈키호테 VMD</span>
                        </button>
                        <button type="button" data-value="USJ IP식품" class="cate-btn border border-gray-200 rounded-xl py-3 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all text-left flex items-center justify-between">
                            <span>🦖 USJ IP 제품/식품</span>
                        </button>
                        <button type="button" data-value="드럭스토어 뷰티" class="cate-btn border border-gray-200 rounded-xl py-3 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all text-left flex items-center justify-between">
                            <span>💄 드럭스토어 뷰티</span>
                        </button>
                        <button type="button" data-value="식비/업무추진" class="cate-btn border border-gray-200 rounded-xl py-3 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all text-left flex items-center justify-between">
                            <span>🍱 식비/업무추진</span>
                        </button>
                        <button type="button" data-value="교통비/기타" class="cate-btn border border-gray-200 rounded-xl py-3 px-4 text-sm font-medium text-gray-700 hover:bg-gray-50 transition-all text-left flex items-center justify-between col-span-2">
                            <span>🚇 교통비 및 기타 샘플매입</span>
                        </button>
                    </div>
                    <input type="hidden" id="selectedCategory" name="selectedCategory" required>
                </div>

                <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 space-y-3">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider">현지 정산 내역 (원화 환산용/선택)</label>
                        <button type="button" id="addSettlementBtn" class="bg-gray-900 text-white rounded-lg px-3 py-1.5 text-xs font-semibold flex items-center gap-1 active:scale-95 transition-transform">
                            <span class="text-xl leading-none">+</span> 내역 추가
                        </button>
                    </div>
                    
                    <div id="settlementRows" class="space-y-2">
                        </div>
                </div>

                <div>
                    <label for="memo" class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">상권 관찰 및 소싱 기획 메모 (필수)</label>
                    <textarea id="memo" name="memo" rows="3" class="w-full border border-gray-200 rounded-xl p-3 text-sm focus:ring-emerald-500 focus:border-emerald-500 bg-gray-50/50" placeholder="예: USJ 미니언즈 구역 틴케이스 쿠키 진열 벤치마킹. 당사 오일 제품 세트 포장에 캐릭터 IP 각인 시 객단가 상승 효과 기대됨." required></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-2">현장 사진 / 실물 영수증 다중 촬영 (최대 5장)</label>
                    <div class="flex items-center justify-center w-full">
                        <label class="flex flex-col items-center justify-center w-full h-24 border-2 border-gray-300 border-dashed rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors" id="dropzone">
                            <div class="flex flex-col items-center justify-center pt-4 pb-3">
                                <span class="text-2xl mb-1">📷</span>
                                <p class="text-xs text-gray-500">카메라 촬영 또는 이미지 선택</p>
                                <p class="text-[10px] text-gray-400 mt-1" id="fileCountLabel">선택된 파일 없음</p>
                            </div>
                            <input type="file" id="imageFiles" name="imageFiles" accept="image/*" class="hidden" multiple />
                        </label>
                    </div>
                    <div id="imagePreviewContainer" class="grid grid-cols-5 gap-2 mt-2"></div>
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl py-4 text-base font-bold shadow active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                    <span>💾</span> 현재 시간으로 증빙 적재
                </button>
            </form>
        </div>

        <div class="space-y-4 pt-4">
            <h2 class="text-lg font-semibold text-gray-950 flex items-center gap-2"><span>🗂️</span> 실시간 증빙 적재 타임라인</h2>
            
            <div id="timeline" class="space-y-4 max-h-[400px] overflow-y-auto pr-1">
                <p class="text-xs text-gray-400 text-center py-6">아직 적재된 증빙 내역이 없습니다.<br>출장지에서 데이터를 입력해 주세요.</p>
            </div>
        </div>

    </main>

    <div id="toastMsg" class="fixed top-5 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur text-white px-5 py-3 rounded-full shadow-2xl text-sm font-bold transition-all duration-300 transform -translate-y-24 opacity-0 z-[100] flex items-center gap-2 whitespace-nowrap pointer-events-none">
        <span id="toastIcon"></span>
        <span id="toastText"></span>
    </div>

    <div id="confirmModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-opacity duration-200 opacity-0">
        <div class="bg-white rounded-2xl p-6 w-full max-w-xs shadow-2xl transform transition-transform duration-200 scale-95" id="confirmBox">
            <h3 class="text-lg font-extrabold text-gray-900 mb-2">🗑️ 증빙 삭제</h3>
            <p class="text-sm text-gray-600 mb-6">이 증빙 기록을 완전히 삭제할까요?</p>
            <div class="flex gap-2">
                <button type="button" id="btnCancel" class="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl text-sm font-bold transition-colors">취소</button>
                <button type="button" id="btnConfirm" class="flex-1 py-3 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-sm font-bold transition-colors shadow-lg shadow-rose-500/30">삭제</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gray-50/80 backdrop-blur-sm border-t border-gray-200 z-50">
        <div class="max-w-xl mx-auto">
            <button id="exportZipBtn" class="w-full bg-gradient-to-r from-gray-800 to-gray-950 hover:from-gray-900 hover:to-black text-white font-bold py-4 px-4 rounded-xl shadow-lg text-sm transition-all flex items-center justify-center gap-2 active:scale-[0.98]">
                <span>📥</span> 귀국용 전체 데이터 다운로드 (텍스트+이미지 ALL .ZIP)
            </button>
        </div>
    </div>

    <script>
        (() => {
            // Data Store (LocalStorage)
            const STORAGE_KEY = 'PRESTIQUE_OSAKA_AUDIT_LOG_V1';
            let auditRecords = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            
            // Fixed Exchange Rate: 100 JPY = 900 KRW
            const JPY_TO_KRW_RATE = 9; 

            // Active Images State (base64 strings with filenames) (★수정 포인트: 배열로 변경)
            let currentFilesData = [];

            // UI Elements
            const form = document.getElementById('auditForm');
            const timeline = document.getElementById('timeline');
            const totalJPYEl = document.getElementById('totalJPY');
            const recordCountEl = document.getElementById('recordCount');
            const categoryInput = document.getElementById('selectedCategory');
            const imageFilesInput = document.getElementById('imageFiles');
            const imagePreviewContainer = document.getElementById('imagePreviewContainer');
            const fileCountLabel = document.getElementById('fileCountLabel');
            const settlementRows = document.getElementById('settlementRows');
            const addSettlementBtn = document.getElementById('addSettlementBtn');
            const exportZipBtn = document.getElementById('exportZipBtn');

            // --- UI Interaction Logic ---

            // Category Selection (Tag Style)
            document.querySelectorAll('.cate-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.cate-btn').forEach(b => {
                        b.classList.remove('bg-emerald-600', 'border-emerald-700', 'text-white');
                        b.classList.add('border-gray-200', 'bg-white', 'text-gray-700');
                    });
                    this.classList.remove('border-gray-200', 'bg-white', 'text-gray-700');
                    this.classList.add('bg-emerald-600', 'border-emerald-700', 'text-white');
                    categoryInput.value = this.getAttribute('data-value');
                });
            });

            // Add Settlement Row (+)
            const createSettlementRow = () => {
                const rowId = `row_${Date.now()}`;
                const div = document.createElement('div');
                div.className = "flex items-center gap-2 bg-white p-2 rounded-lg border border-gray-200 shadow-inner";
                div.id = rowId;
                div.innerHTML = `
                    <input type="text" placeholder="품목" class="settle-item flex-1 border border-gray-200 rounded-md px-2 py-1.5 text-sm focus:ring-emerald-500 focus:border-emerald-500" required>
                    <div class="w-28 relative">
                        <input type="number" placeholder="금액" class="settle-amt w-full border border-gray-200 rounded-md pl-2 pr-6 py-1.5 text-sm focus:ring-emerald-500 focus:border-emerald-500 text-right font-semibold text-gray-950" required>
                        <span class="absolute right-2 top-2 text-xs text-gray-400 font-bold">￥</span>
                    </div>
                    <button type="button" class="text-rose-500 p-1 hover:bg-rose-50 rounded" onclick="document.getElementById('${rowId}').remove(); window.dispatchEvent(new Event('settlementChanged'));">
                        🗑️
                    </button>
                `;
                settlementRows.appendChild(div);
                window.dispatchEvent(new Event('settlementChanged'));
            };
            addSettlementBtn.addEventListener('click', createSettlementRow);

            // --- Multi-Image Logic (★핵심 수정 포인트) ---

            // --- Multi-Image Logic (누적 및 개별 삭제 개선) ---

            function renderImagePreviews() {
                imagePreviewContainer.innerHTML = '';
                fileCountLabel.textContent = `${currentFilesData.length}개의 이미지 선택됨 (최대5장)`;

                currentFilesData.forEach(fileObj => {
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'relative aspect-square bg-gray-100 rounded-lg overflow-hidden border border-gray-200 shadow-sm';
                    imgWrapper.innerHTML = `
                        <img src="${fileObj.data}" class="w-full h-full object-cover">
                        <button type="button" data-id="${fileObj.id}" class="remove-img-btn absolute top-1 right-1 bg-black/60 backdrop-blur-md text-white rounded-full w-6 h-6 flex items-center justify-center text-[10px] active:scale-90 transition-transform">
                            ✕
                        </button>
                    `;
                    imagePreviewContainer.appendChild(imgWrapper);
                });
            }

            imageFilesInput.addEventListener('change', function(e) {
                const files = Array.from(e.target.files);
                if(files.length === 0) return;

                // 잔여 슬롯 계산
                const remainingSlots = 5 - currentFilesData.length;
                const filesToAdd = files.slice(0, remainingSlots);

                if (files.length > remainingSlots && remainingSlots > 0) {
                    showToast('⚠️', `최대 5장까지만 등록 가능합니다. ${filesToAdd.length}장만 추가됩니다.`);
                } else if (remainingSlots === 0) {
                    showToast('🚫', '이미 최대 5장의 사진이 등록되어 있습니다.');
                    imageFilesInput.value = ''; // 초기화
                    return;
                }

                filesToAdd.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function(evt) {
                        const base64String = evt.target.result;
                        currentFilesData.push({
                            id: `img_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`, // 삭제용 고유 ID
                            name: `img_${Date.now()}_${index}.${file.name.split('.').pop()}`,
                            data: base64String
                        });
                        renderImagePreviews(); // 추가될 때마다 다시 렌더링
                    }
                    reader.readAsDataURL(file);
                });

                // ★핵심: 다음 연속 촬영을 위해 input 값을 비워줌 (그래야 change 이벤트가 또 발생함)
                imageFilesInput.value = ''; 
            });

            // 개별 이미지 삭제 (이벤트 위임)
            imagePreviewContainer.addEventListener('click', function(e) {
                const removeBtn = e.target.closest('.remove-img-btn');
                if (removeBtn) {
                    const idToRemove = removeBtn.getAttribute('data-id');
                    currentFilesData = currentFilesData.filter(img => img.id !== idToRemove);
                    renderImagePreviews();
                }
            });

            // --- Form Submit & Data Capture ---

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                if(!categoryInput.value) {
                    showToast('⚠️', '업무 카테고리를 선택해 주세요.');
                    return;
                }

                // Gather Dynamic Settlements
                const settlements = [];
                // 클래스명(.settle-item)이 있는 인풋들을 기준으로 안전하게 역추적합니다.
                const itemInputs = settlementRows.querySelectorAll('.settle-item');
                
                itemInputs.forEach(itemInput => {
                    const row = itemInput.closest('div'); // 인풋이 속한 해당 행(Row)만 타겟팅
                    if (row) {
                        const amtInput = row.querySelector('.settle-amt');
                        const item = itemInput.value.trim();
                        const amount = amtInput ? amtInput.value : "";

                        // 품목과 금액이 모두 입력된 정상적인 데이터만 안전하게 필터링하여 적재
                        if (item && amount) {
                            settlements.push({ item, amount: parseFloat(amount) });
                        }
                    }
                });

                const now = new Date();
                const dateTimeStr = now.toISOString().replace('T', ' ').slice(0, 19);

                const newRecord = {
                    timestamp: now.getTime(),
                    dateTimeStr: dateTimeStr,
                    category: categoryInput.value,
                    memo: document.getElementById('memo').value.trim(),
                    settlements: settlements,
                    images: currentFilesData, // ★수정 포인트: base64 payload array 저장
                    location: null
                };
                saveAndReset(newRecord);
            });

            function saveAndReset(record) {
                auditRecords.push(record);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(auditRecords));
                
                // UI Update
                renderTimeline();
                updateQuickStats();

                // Reset form controls
                form.reset();
                categoryInput.value = '';
                document.querySelectorAll('.cate-btn').forEach(b => {
                    b.classList.remove('bg-emerald-600', 'border-emerald-700', 'text-white');
                    b.classList.add('border-gray-200', 'bg-white', 'text-gray-700');
                });
                settlementRows.innerHTML = '';
                imagePreviewContainer.innerHTML = '';
                currentFilesData = [];
                fileCountLabel.textContent = '선택된 파일 없음';
                // document.getElementById('gpsStatus').classList.add('hidden');
                
                showToast('✅', '증빙 데이터가 성공적으로 적재되었습니다.');
            }

            // --- Timeline & Stats Rendering ---

            function updateQuickStats() {
                let totalJpySum = 0;
                auditRecords.forEach(rec => {
                    if(rec.settlements) {
                        rec.settlements.forEach(s => totalJpySum += s.amount);
                    }
                });

                totalJPYEl.textContent = totalJpySum.toLocaleString();
                recordCountEl.textContent = auditRecords.length;
            }

            // --- Timeline & Stats Rendering ---

            function updateQuickStats() {
                let totalJpySum = 0;
                auditRecords.forEach(rec => {
                    if(rec.settlements) {
                        rec.settlements.forEach(s => totalJpySum += s.amount);
                    }
                });

                totalJPYEl.textContent = totalJpySum.toLocaleString();
                recordCountEl.textContent = auditRecords.length;
            }

            function renderTimeline() {
                if (auditRecords.length === 0) {
                    timeline.innerHTML = `<p class="text-xs text-gray-400 text-center py-6">아직 적재된 증빙 내역이 없습니다.<br>출장지에서 데이터를 입력해 주세요.</p>`;
                    return;
                }

                timeline.innerHTML = '';
                // Sort latest first
                const sortedRecords = [...auditRecords].sort((a,b) => b.timestamp - a.timestamp);

                sortedRecords.forEach(rec => {
                    let totalJpy = 0;
                    let settlementHtml = '';
                    if(rec.settlements && rec.settlements.length > 0) {
                        settlementHtml = `<div class="mt-2 bg-gray-50 p-2 rounded-lg space-y-1 border border-gray-100">`;
                        rec.settlements.forEach(s => {
                            totalJpy += s.amount;
                            settlementHtml += `
                                <div class="flex justify-between text-xs">
                                    <span class="text-gray-600">• ${s.item}</span>
                                    <span class="font-semibold text-gray-950">${s.amount.toLocaleString()} ￥</span>
                                </div>`;
                        });
                        settlementHtml += `</div>`;
                    }

                    const imgCount = rec.images ? rec.images.length : 0;
                    const item = document.createElement('div');
                    item.className = "border-l-2 border-emerald-500 pl-3 py-1 space-y-1.5 relative";
                    item.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div class="flex items-center gap-1.5">
                                <span class="bg-emerald-500 text-white text-[10px] px-2 py-0.5 rounded-md font-bold">${rec.category}</span>
                                <button type="button" data-timestamp="${rec.timestamp}" class="delete-record-btn text-[10px] text-rose-500 bg-rose-50 hover:bg-rose-100 border border-rose-100 px-1.5 py-0.5 rounded transition-colors">
                                    🗑️ 삭제
                                </button>
                            </div>
                            <span class="text-[11px] font-bold text-amber-600">${totalJpy.toLocaleString()} ￥</span>
                        </div>
                        <p class="text-xs text-gray-700 font-medium whitespace-pre-wrap">${rec.memo}</p>
                        ${settlementHtml}
                        <div class="flex justify-between items-center text-[10px] text-gray-400 pt-1">
                            <span>⏰ ${rec.dateTimeStr}</span>
                            <span>${imgCount > 0 ? `| 📸 사진 ${imgCount}장` : ''}</span>
                        </div>
                    `;
                    timeline.appendChild(item);
                });
            }

            // [신규 추가] 타임라인 내 삭제 버튼 클릭 이벤트 처리 (이벤트 위임)
            timeline.addEventListener('click', function(e) {
                const deleteBtn = e.target.closest('.delete-record-btn');
                if (deleteBtn) {
                    const timestamp = parseInt(deleteBtn.getAttribute('data-timestamp'), 10);
                    
                    if (confirm('이 증빙 기록을 삭제하시겠습니까?')) {
                        // 해당 timestamp를 가진 기록을 배열에서 제거
                        auditRecords = auditRecords.filter(rec => rec.timestamp !== timestamp);
                        
                        // 로컬 스토리지 동기화
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(auditRecords));
                        
                        // 통계 및 타임라인 UI 리렌더링
                        updateQuickStats();
                        renderTimeline();
                    }
                }
            });


            // --- ZIP Export Logic (Client-Side) (★핵심 수정 포인트: 다중 이미지 패키징) ---

            exportZipBtn.addEventListener('click', async function() {
                if(auditRecords.length === 0) {
                    showToast('❗', '다운로드할 데이터가 없습니다.');
                    return;
                }

                exportZipBtn.disabled = true;
                exportZipBtn.textContent = "⚡ ZIP 압축 파일 생성 중...";

                try {
                    const zip = new JSZip();
                    
                    // 1. Generate Structured Text Data (CSV Format for tax accountant)
                    // Add BOM for proper encoding when opened in Excel
                    let csvContent = "\uFEFF순번,일시,카테고리,상권 관찰 및 소싱 기획 메모,정산 합계(JPY),정산 세부 내역,연동 이미지 파일명(세미콜론 구분)\n";
                    
                    auditRecords.forEach((rec, idx) => {
                        let totalJpy = 0;
                        let detailParts = [];
                        if(rec.settlements) {
                            rec.settlements.forEach(s => {
                                totalJpy += s.amount;
                                detailParts.push(`${s.item}(${s.amount}￥)`);
                            });
                        }
                        const detailStr = detailParts.join(' | ');
                        const lat = rec.location ? rec.location.lat : '';
                        const lng = rec.location ? rec.location.lng : '';
                        
                        // Handle multiple image filenames
                        let linkedFiles = [];
                        if(rec.images) {
                            rec.images.forEach(img => {
                                linkedFiles.push(img.name);
                                
                                // 2. Add individual image base64 file to ZIP root folder
                                const base64Data = img.data.split(',')[1]; // strip header metadata
                                zip.file(`images/${img.name}`, base64Data, {base64: true});
                            });
                        }

                        // Escape quotes for CSV stability
                        const escapedMemo = rec.memo.replace(/"/g, '""');
                        csvContent += `"${idx+1}","${rec.dateTimeStr}","${rec.category}","${escapedMemo}","${totalJpy}","${detailStr}","${lat}","${lng}","${linkedFiles.join(';')}"\n`;
                    });

                    // Add CSV file to ZIP container
                    zip.file("오사카_출장_세무증빙_마스터기록.csv", csvContent);

                    // 3. Generate ZIP binary and trigger download
                    const content = await zip.generateAsync({type: "blob"});
                    const link = document.createElement("a");
                    link.href = URL.createObjectURL(content);
                    link.download = `PRESTIQUE_OSAKA_AUDIT_DATA_${new Date().toISOString().slice(0,10)}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                } catch(err) {
                    console.error(err);
                    showToast('❌', 'ZIP 압축 파일 생성 중 오류가 발생했습니다.');
                } finally {
                    exportZipBtn.disabled = false;
                    exportZipBtn.textContent = "📥 귀국용 전체 데이터 다운로드 (ALL .ZIP)";
                }
            });

            // Handle UI events for total recalculation
            window.addEventListener('settlementChanged', updateQuickStats);

            // Init load
            updateQuickStats();
            renderTimeline();
            
            // --- Custom UI Controllers (팝업 & 모달) ---
            const toastEl = document.getElementById('toastMsg');
            let toastTimer;
            function showToast(icon, msg) {
                document.getElementById('toastIcon').textContent = icon;
                document.getElementById('toastText').textContent = msg;
                
                toastEl.classList.remove('-translate-y-24', 'opacity-0');
                toastEl.classList.add('translate-y-0', 'opacity-100');
                
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('translate-y-0', 'opacity-100');
                    toastEl.classList.add('-translate-y-24', 'opacity-0');
                }, 2500); // 2.5초 후 사라짐
            }

            const modalEl = document.getElementById('confirmModal');
            const modalBox = document.getElementById('confirmBox');
            let confirmCallback = null;

            function showConfirm(callback) {
                confirmCallback = callback;
                modalEl.classList.remove('hidden');
                // 약간의 지연을 주어 트랜지션 애니메이션이 작동하도록 함
                setTimeout(() => {
                    modalEl.classList.remove('opacity-0');
                    modalBox.classList.remove('scale-95');
                    modalBox.classList.add('scale-100');
                }, 10);
            }

            function closeConfirm() {
                modalEl.classList.add('opacity-0');
                modalBox.classList.remove('scale-100');
                modalBox.classList.add('scale-95');
                setTimeout(() => {
                    modalEl.classList.add('hidden');
                    confirmCallback = null;
                }, 200);
            }

            document.getElementById('btnCancel').addEventListener('click', closeConfirm);
            document.getElementById('btnConfirm').addEventListener('click', () => {
                if(confirmCallback) confirmCallback();
                closeConfirm();
            });

            // --- Form Submit & Delete Validation Update ---

            // 2. timeline.addEventListener('click') 내의 confirm() 삭제 로직 교체:
            timeline.addEventListener('click', function(e) {
                const deleteBtn = e.target.closest('.delete-record-btn');
                if (deleteBtn) {
                    const timestamp = parseInt(deleteBtn.getAttribute('data-timestamp'), 10);
                    
                    // 네이티브 confirm 대신 커스텀 모달 호출
                    showConfirm(() => {
                        auditRecords = auditRecords.filter(rec => rec.timestamp !== timestamp);
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(auditRecords));
                        updateQuickStats();
                        renderTimeline();
                        showToast('🗑️', '기록이 삭제되었습니다.');
                    });
                }
            });

        })();
    </script>
</body>
</html>
